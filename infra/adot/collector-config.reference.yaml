# Reference copy — deployed config is tillflow-collector.yaml (baked into the
# private ADOT ECR image via infra/adot/Dockerfile + buildspecs/mirror-adot.yml).
#
# Stock ecs-default-config.yaml sends metrics to CloudWatch EMF only; it does not
# remote-write to AMP even when AWS_PROMETHEUS_ENDPOINT is set on the sidecar.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 10
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: probabilistic
        type: probabilistic
        probabilistic:
          sampling_percentage: 100

exporters:
  awsxray:
    region: ${AWS_REGION}
  prometheusremotewrite:
    endpoint: ${AWS_PROMETHEUS_ENDPOINT}

extensions:
  health_check:
    endpoint: localhost:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [tail_sampling, batch]
      exporters: [awsxray]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheusremotewrite]
