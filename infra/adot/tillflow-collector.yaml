# TillFlow ADOT config (ECS sidecar). Baked into the private ADOT ECR image.
# Metrics: OTLP -> AMP remote write (AWS_PROMETHEUS_ENDPOINT on the task).
# Traces: OTLP -> X-Ray with tail sampling (ADR-008 amendment).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 10
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: probabilistic
        type: probabilistic
        probabilistic:
          sampling_percentage: 100

exporters:
  awsxray:
    region: ${AWS_REGION}
  prometheusremotewrite:
    endpoint: ${AWS_PROMETHEUS_ENDPOINT}
    auth:
      authenticator: sigv4auth

# sigv4auth: AMP remote write requires SigV4 (task role needs aps:RemoteWrite).
extensions:
  health_check:
    endpoint: localhost:13133
  sigv4auth:
    service: aps
    region: ${AWS_REGION}

service:
  extensions: [health_check, sigv4auth]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [tail_sampling, batch]
      exporters: [awsxray]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheusremotewrite]
