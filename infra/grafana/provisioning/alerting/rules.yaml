# Provisioned Grafana rules — docs/runbook.md § Observability alerts (Phase E).
# Slack messages use the 9-field TillFlow alert contract from docker-entrypoint.sh.
# EdgeProbeFailed is backed by the CloudWatch Synthetics canary alarm in Terraform;
# this Grafana rule remains a dashboard-side guard for AMP/telemetry visibility.
apiVersion: 1
groups:
  - orgId: 1
    name: tillflow-starter
    folder: TillFlow Alerts
    interval: 1m
    rules:
      - uid: tillflow-payments-5xx
        title: PaymentsHigh5xxRate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: AMP
            model:
              # `> 0.008` (~2.4 requests per 5m) is a minimum-traffic guard, not
              # a second threshold. /health and /ready are excluded from RED
              # metrics on purpose (middleware.py DEFAULT_EXCLUDED_PATHS), so
              # the denominator is business traffic only. Without the guard a
              # single 5xx in an idle window reads as a 100% error rate and
              # pages -- observed 2026-09-21.
              expr: (sum(rate(payments_requests_total{status="5xx"}[5m])) / clamp_min(sum(rate(payments_requests_total[5m])), 1e-9)) and (sum(rate(payments_requests_total[5m])) > 0.008)
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0.05]
                  operator:
                    type: and
                  reducer:
                    type: last
        # OK, not NoData: an idle window means no requests, therefore no failed
        # requests. With NoData, Grafana re-notified every 1m evaluation and
        # sent a payments-outage-shaped Slack message while payments was
        # healthy. Absence of traffic is covered by EdgeProbeFailed.
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: Payments 5xx ratio above 5% for 10 minutes.
          env: dev
          service: payments
          symptom: Valid payment routes are returning elevated 5xx responses.
          user_impact: Tenants may be unable to start or complete STK payments.
          first_safe_action: Check payments ECS events/logs and recent deployments; rollback payments if the new image caused the spike.
          recovery_signal: 5xx ratio below 2% for 15 minutes and /ready returns 200.
          owner: Minage / Payments DRI
          runbook_url: docs/runbook.md#observability-alerts
          dashboard_url: /d/tillflow-payments/payments-service-overview
        labels:
          severity: warning
          team: reliability

      - uid: tillflow-payments-latency-p95
        title: PaymentsLatencyP95
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: AMP
            model:
              expr: histogram_quantile(0.95, sum(rate(payments_request_duration_seconds_bucket[5m])) by (le))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [2]
                  operator:
                    type: and
                  reducer:
                    type: last
        # Same reasoning as PaymentsHigh5xxRate: no requests means no latency
        # to breach. histogram_quantile over an empty range returns NaN, which
        # Grafana reports as NoData -- that must not page.
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: Payments p95 latency above 2 seconds for 15 minutes.
          env: dev
          service: payments
          symptom: Payment API latency is above the SLO guardrail.
          user_impact: Customers may wait longer for STK initiation/callback handling.
          first_safe_action: Check RDS Proxy connections, Daraja sandbox latency, and payments task CPU/memory.
          recovery_signal: p95 below 1 second for 15 minutes with no growing callback backlog.
          owner: Minage / Payments DRI
          runbook_url: docs/runbook.md#observability-alerts
          dashboard_url: /d/tillflow-payments/payments-service-overview
        labels:
          severity: warning
          team: reliability

      - uid: tillflow-edge-probe-failed
        title: EdgeProbeFailed
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: AMP
            model:
              # Placeholder until Synthetics SuccessPercent is in AMP. Do not use
              # count({__name__=~".+"}) — dev AMP often has <50 series and NoData
              # looked like edge failure (Slack spam while /health was 200).
              expr: vector(0)
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
                  operator:
                    type: and
                  reducer:
                    type: last
        # CloudWatch alarm devops-g3-edge-health-canary remains source of truth
        # (Terraform; no SNS→Slack yet). Grafana must not page on AMP idle/NoData.
        noDataState: OK
        execErrState: OK
        isPaused: false
        for: 5m
        annotations:
          summary: Edge health or telemetry visibility failed; CloudWatch alarm devops-g3-edge-health-canary is source of truth.
          env: dev
          service: edge/web
          symptom: External /health canary is failing or AMP visibility collapsed.
          user_impact: Users may not reach the TillFlow API edge reliably.
          first_safe_action: Check CloudWatch alarm devops-g3-edge-health-canary, API Gateway, VPC Link/ALB target health, and web ECS events.
          recovery_signal: CloudWatch Synthetics SuccessPercent returns to 100% for two consecutive runs and /health curls 200.
          owner: Minage / Platform
          runbook_url: docs/runbook.md#observability-alerts
          dashboard_url: /d/tillflow-slo/tillflow-slo-uptime-2b-burn
        labels:
          severity: critical
          team: reliability
