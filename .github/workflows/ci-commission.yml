name: ci-commission

on:
  pull_request:
    branches: [main]
    paths:
      - "services/_shared/**"
      - "services/commission/**"
      - ".github/workflows/ci-commission.yml"
  push:
    branches: [main]
    paths:
      - "services/_shared/**"
      - "services/commission/**"
      - ".github/workflows/ci-commission.yml"

jobs:
  lint:
    name: lint (services/commission)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ruff check
        working-directory: services/commission
        run: |
          pip install --quiet ruff
          ruff check .

  dependency-scan:
    name: dependency scan (services/commission)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tillflow-shared
        run: pip install --quiet -e "services/_shared[dev]"

      - name: Install package
        working-directory: services/commission
        run: pip install --quiet -e ".[dev]"

      - name: pip-audit
        working-directory: services/commission
        run: |
          pip install --quiet pip-audit
          pip-audit --skip-editable

  commission:
    name: commission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tillflow-shared
        working-directory: services/_shared
        run: pip install -e ".[dev]"

      - name: Install tillflow-commission
        working-directory: services/commission
        run: pip install -e ".[dev]"

      - name: Pytest
        working-directory: services/commission
        env:
          TILLFLOW_TELEMETRY_EXPORT: none
          COMMISSION_WORKER_ENABLED: "false"
        run: pytest -v
