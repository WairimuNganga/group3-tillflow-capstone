name: ci-payments

# Path-filtered so a change under services/payments/ builds & tests only
# Payments (+ its shared dependency) -- not every service every time. This
# workflow itself is not on the required-checks list (see ci.yml's jobs for
# what is), so a PR that doesn't touch these paths never runs it, on purpose:
# nothing here needs to report for it to be safe to merge.
on:
  pull_request:
    branches: [main]
    paths:
      - "services/_shared/**"
      - "services/payments/**"
      - ".github/workflows/ci-payments.yml"
  push:
    branches: [main]
    paths:
      - "services/_shared/**"
      - "services/payments/**"
      - ".github/workflows/ci-payments.yml"

jobs:
  lint:
    name: lint (services/payments)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ruff check
        working-directory: services/payments
        run: |
          pip install --quiet ruff
          ruff check .

  dependency-scan:
    name: dependency scan (services/payments)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # payments depends on tillflow-shared, which isn't on PyPI --
      # installing it standalone fails with "No matching distribution found
      # for tillflow-shared" (hit this exact failure once already in the
      # original, unfiltered dependency-scan job). Install _shared first.
      - name: Install tillflow-shared
        run: pip install --quiet -e "services/_shared[dev]"

      - name: Install package
        working-directory: services/payments
        run: pip install --quiet -e ".[dev]"

      # --skip-editable, not --strict -- see ci.yml's dependency-scan job
      # for why --strict is permanently red here regardless of real
      # vulnerabilities.
      - name: pip-audit
        working-directory: services/payments
        run: |
          pip install --quiet pip-audit
          pip-audit --skip-editable

  payments:
    name: payments (Phase 0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tillflow-shared
        working-directory: services/_shared
        run: pip install -e ".[dev]"

      - name: Install tillflow-payments
        working-directory: services/payments
        run: pip install -e ".[dev]"

      - name: Pytest
        working-directory: services/payments
        env:
          MPESA_ADAPTER: fake
          TILLFLOW_TELEMETRY_EXPORT: none
        run: pytest -v
