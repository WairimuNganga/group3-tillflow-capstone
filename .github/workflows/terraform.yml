name: terraform

# Path-filtered so a services/ change does not run an infra plan, and vice
# versa (the brief's per-service build requirement, applied to infra).
on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

# One infra run at a time. Two concurrent applies would contend on the state
# lock and one would fail partway.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_VERSION: "1.15.8"
  AWS_REGION: us-west-1

jobs:
  # No AWS credentials at all. Everything here is static or mocked, so it runs
  # on a fork PR safely and gives fast feedback.
  validate:
    name: fmt / validate / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: fmt
        run: terraform fmt -check -recursive infra/

      - name: init (no backend — provider plugins only)
        working-directory: infra/envs/dev
        run: terraform init -backend=false

      - name: validate
        working-directory: infra/envs/dev
        run: terraform validate

      # Architecture contracts + naming rules, via mock_provider. This is the
      # G1 naming/tag audit as a test rather than a screenshot.
      - name: test
        working-directory: infra/envs/dev
        run: terraform test

      - name: validate bootstrap stack
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false
          terraform validate

  # Read-only plan against the real account. Runs on PRs so a reviewer sees
  # what would change; the role it assumes cannot apply.
  plan:
    name: plan (dev)
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: init
        working-directory: infra/envs/dev
        run: terraform init -input=false

      - name: plan
        working-directory: infra/envs/dev
        env:
          TF_VAR_kms_key_arn: ${{ vars.KMS_KEY_ARN }}
        run: terraform plan -input=false -no-color -out=tfplan

      # The audit runs against the plan, so its output is reproducible
      # evidence for G1 rather than a console screenshot.
      - name: naming + tag audit
        working-directory: infra/envs/dev
        run: |
          terraform show -json tfplan > plan.json
          ../../scripts/audit-naming-tags.sh plan.json | tee audit.txt

      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}
          path: |
            infra/envs/dev/plan.json
            infra/envs/dev/audit.txt
          retention-days: 30

  apply:
    name: apply (dev)
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Protected environment: apply waits for whatever reviewers are configured
    # on it in repo settings (ADR-009).
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # OIDC — no long-lived AWS keys exist anywhere in this repo (T6.1).
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: init
        working-directory: infra/envs/dev
        run: terraform init -input=false

      # Read each service's currently-deployed SHA from SSM rather than using
      # the tfvars default. Without this, an infra-only merge would roll every
      # running service back to REPLACE_ME.
      - name: resolve deployed image tags
        working-directory: infra/envs/dev
        run: |
          set -euo pipefail
          tags=""
          for svc in web pos payments commission; do
            sha=$(aws ssm get-parameter \
              --name "/devops-g3/$svc/image-tag" \
              --query 'Parameter.Value' --output text 2>/dev/null || echo "REPLACE_ME")
            echo "[$svc] $sha"
            tags="${tags}${svc}=\"${sha}\","
          done
          echo "TF_VAR_image_tags={${tags%,}}" >> "$GITHUB_ENV"

      - name: plan
        working-directory: infra/envs/dev
        env:
          TF_VAR_kms_key_arn: ${{ vars.KMS_KEY_ARN }}
        run: terraform plan -input=false -out=tfplan

      - name: naming + tag audit
        working-directory: infra/envs/dev
        run: |
          terraform show -json tfplan > plan.json
          ../../scripts/audit-naming-tags.sh plan.json | tee audit.txt

      # apply the saved plan, not a fresh one — plan/apply parity, so what a
      # reviewer saw is exactly what runs.
      - name: apply
        working-directory: infra/envs/dev
        run: terraform apply -input=false tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: terraform-apply-${{ github.sha }}
          path: |
            infra/envs/dev/plan.json
            infra/envs/dev/audit.txt
          retention-days: 90
