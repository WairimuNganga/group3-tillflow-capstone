name: ci-web

on:
  pull_request:
    branches: [main]
    paths:
      - "services/_shared/**"
      - "services/web/**"
      - ".github/workflows/ci-web.yml"
  push:
    branches: [main]
    paths:
      - "services/_shared/**"
      - "services/web/**"
      - ".github/workflows/ci-web.yml"

jobs:
  lint:
    name: lint (services/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ruff check
        working-directory: services/web
        run: |
          pip install --quiet ruff
          ruff check .

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tillflow-shared
        working-directory: services/_shared
        run: pip install -e ".[dev]"
      - name: Install tillflow-web
        working-directory: services/web
        run: pip install -e ".[dev]"
      - name: Pytest
        working-directory: services/web
        env:
          TILLFLOW_TELEMETRY_EXPORT: none
        run: pytest -v
