services:
  db:
    image: postgres:16
    container_name: tillflow-commission-db
    environment:
      POSTGRES_USER: tillflow
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: tillflow
    ports:
      - "5433:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - commission_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tillflow -d tillflow"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  commission_pg:
