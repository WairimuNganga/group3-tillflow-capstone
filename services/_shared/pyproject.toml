[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tillflow-shared"
version = "0.1.0"
description = "TillFlow cross-service shared libraries: M-Pesa adapter, telemetry, health routes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "opentelemetry-sdk>=1.30,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24,<2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tillflow_shared*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP042 (str+Enum -> enum.StrEnum) is intentionally off: it would rewrite the
# base class of state-machine enums (PaymentState, PayoutState, ...) as a side
# effect of a lint gate. That's a deliberate, reviewed change for whoever owns
# the enum, not an automated one.
ignore = ["UP042"]

# FastAPI's DI pattern requires Depends(...)/Query(...)/etc as a literal default
# argument -- that's the framework contract, not the mutable-default-argument bug
# B008 exists to catch. Without this, every route signature is a false positive.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Header",
    "fastapi.Path", "fastapi.Body", "fastapi.Cookie",
]
