# Scrapes the collector's Prometheus endpoint. In us-west-1 this role is played by
# Amazon Managed Prometheus, which the ADOT sidecar remote-writes to instead
# (ADR-001: Amazon Managed Grafana is unavailable in the region, AMP is not).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["collector:8889"]
