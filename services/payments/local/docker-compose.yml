services:
  postgres:
    image: postgres:16-alpine
    container_name: tillflow-payments-db
    environment:
      POSTGRES_USER: tillflow
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: tillflow
    ports:
      - "5432:5432"
    volumes:
      - payments_pg_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tillflow -d tillflow"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  payments_pg_data:
