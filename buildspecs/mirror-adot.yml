version: 0.2

# Mirrors the pinned ARM64 ADOT collector into private ECR before service
# builds run. The destination repository is immutable, so an existing tag is
# verified and reused instead of pushed again.

env:
  shell: bash

phases:
  build:
    commands:
      - |
        set -euo pipefail

        AWS_REGION="${AWS_DEFAULT_REGION:-us-west-1}"
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
        DESTINATION_IMAGE="${REGISTRY}/${ADOT_REPOSITORY}:${ADOT_IMAGE_TAG}"

        if aws ecr describe-images \
          --repository-name "${ADOT_REPOSITORY}" \
          --image-ids imageTag="${ADOT_IMAGE_TAG}" >/dev/null 2>&1; then
          echo "Reusing existing ADOT mirror ${DESTINATION_IMAGE}"
        else
          echo "Mirroring ${ADOT_SOURCE_IMAGE} to ${DESTINATION_IMAGE}"

          aws ecr get-login-password --region "${AWS_REGION}" \
          | docker login --username AWS --password-stdin "${REGISTRY}"

          docker pull --platform "${IMAGE_PLATFORM}" "${ADOT_SOURCE_IMAGE}"
          docker tag "${ADOT_SOURCE_IMAGE}" "${DESTINATION_IMAGE}"
          docker push "${DESTINATION_IMAGE}"
        fi

        aws ecr describe-images \
          --repository-name "${ADOT_REPOSITORY}" \
          --image-ids imageTag="${ADOT_IMAGE_TAG}" \
          --query 'imageDetails[0].{tags:imageTags,digest:imageDigest,pushedAt:imagePushedAt}' \
          --output table
