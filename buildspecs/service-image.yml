version: 0.2

# Builds one TillFlow service image from the shared golden-path Dockerfile.
# CodePipeline sets SERVICE_NAME for each action: web, pos, payments, commission.

env:
  variables:
    NAME_PREFIX: devops-g3
    IMAGE_PLATFORM: linux/arm64

phases:
  pre_build:
    commands:
      - set -euo pipefail
      - AWS_REGION=${AWS_DEFAULT_REGION:-us-west-1}
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_REPO="${NAME_PREFIX}/${SERVICE_NAME}"
      - REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
      - IMAGE_TAG=$(echo "${CODEBUILD_RESOLVED_SOURCE_VERSION:-dev}" | cut -c1-40)
      - IMAGE_URI="${REGISTRY}/${ECR_REPO}:${IMAGE_TAG}"
      - echo "Building ${SERVICE_NAME} for ${IMAGE_PLATFORM} -> ${IMAGE_URI}"
      - aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${REGISTRY}"

  build:
    commands:
      - docker build --platform "${IMAGE_PLATFORM}" -f services/_shared/Dockerfile.base --build-arg GIT_COMMIT_SHA="${IMAGE_TAG}" --build-arg SERVICE_NAME="${SERVICE_NAME}" -t "tillflow-base:${IMAGE_TAG}" services/_shared
      - docker build --platform "${IMAGE_PLATFORM}" -f services/_shared/examples/Dockerfile --build-arg BASE_IMAGE="tillflow-base:${IMAGE_TAG}" --build-arg SERVICE_NAME="${SERVICE_NAME}" -t "${IMAGE_URI}" services/_shared

  post_build:
    commands:
      - docker push "${IMAGE_URI}"
      - IMAGE_DIGEST=$(aws ecr describe-images --repository-name "${ECR_REPO}" --image-ids imageTag="${IMAGE_TAG}" --query 'imageDetails[0].imageDigest' --output text)
      - aws ecr start-image-scan --repository-name "${ECR_REPO}" --image-id imageTag="${IMAGE_TAG}" >/dev/null 2>&1 || true
      - aws ecr wait image-scan-complete --repository-name "${ECR_REPO}" --image-id imageTag="${IMAGE_TAG}" || true
      - HIGH_FINDINGS=$(aws ecr describe-image-scan-findings --repository-name "${ECR_REPO}" --image-id imageTag="${IMAGE_TAG}" --query "length(imageScanFindings.findings[?severity=='HIGH' || severity=='CRITICAL'])" --output text 2>/dev/null || echo 0)
      - if [ "${HIGH_FINDINGS}" != "0" ]; then echo "Image scan found ${HIGH_FINDINGS} HIGH/CRITICAL findings"; exit 1; fi
      - aws ssm put-parameter --name "/${NAME_PREFIX}/${SERVICE_NAME}/image-tag" --type String --value "${IMAGE_TAG}" --overwrite
      - aws ssm put-parameter --name "/${NAME_PREFIX}/${SERVICE_NAME}/image-digest" --type String --value "${IMAGE_DIGEST}" --overwrite
      - for param in image-tag image-digest; do aws ssm add-tags-to-resource --resource-type Parameter --resource-id "/${NAME_PREFIX}/${SERVICE_NAME}/${param}" --tags "Key=group,Value=${NAME_PREFIX}" "Key=owner,Value=lwam" "Key=environment,Value=dev" "Key=service,Value=${SERVICE_NAME}" "Key=managed-by,Value=terraform" "Key=capstone,Value=tillflow"; done
      - printf '[{"name":"%s","imageUri":"%s"}]' "${SERVICE_NAME}" "${IMAGE_URI}" > imagedefinitions.json
      - echo "${SERVICE_NAME}=${IMAGE_URI}@${IMAGE_DIGEST}"

artifacts:
  files:
    - imagedefinitions.json
